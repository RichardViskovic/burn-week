<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Timetable Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="no-print header-controls">
        <h1>Timetable Generator</h1>
        <p>Import "Timetables.csv" to visualize and print student schedules.</p>
        <div class="import-section">
            <div class="input-group">
                <label for="csvFileInput">Upload Timetables CSV:</label>
                <input type="file" id="csvFileInput" accept=".csv">
            </div>
            <div class="input-group search-container">
                <label for="studentSearch">Search Student:</label>
                <input type="text" id="studentSearch" placeholder="Filter by name..." autocomplete="off">
            </div>
            <button onclick="window.print()" id="printButton" disabled>Print All</button>
            <button id="clearCacheButton" class="danger-button">Clear Data</button>
        </div>
        <div id="statusMessage" class="status-message"></div>
    </div>

    <div id="timetableContainer">
        <!-- Timetables will be generated here -->
    </div>

    <script src="app.js"></script>
</body>
</html>
